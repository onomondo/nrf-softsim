name: Check Codebase Formatting

on:
  pull_request:
    paths-ignore:
      - 'modules/lib/onomondo-uicc/**'
      - 'modules/lib/onomondo-uicc'

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          # List tracked sources only, then filter to the directories we own.
          # git ls-files (rather than find) keeps local build artifacts and the
          # vendored sample modules out, so this behaves the same on a developer
          # machine as it does on a fresh CI checkout.
          FILES=$(git ls-files '*.c' '*.h' \
            | grep -E "^(lib/|samples/softsim_(external|static)_profile/|tests/)" \
            | grep -v "lib/include/" \
            | grep -v "lib/onomondo-uicc/")
          clang-format --dry-run -Werror $FILES
