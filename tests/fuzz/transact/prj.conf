# Build this app as an LLVM libfuzzer target (native_sim/native/64 + clang).
CONFIG_ARCH_POSIX_LIBFUZZER=y
CONFIG_ASSERT=y

# The real nRF filesystem port runs over Zephyr NVS on the flash simulator,
# exactly as tests/apdu drives it.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NVS=y

# The UICC core allocates its context, file buffers and directory cache through
# the port heap (SS_ALLOC -> port_malloc -> k_malloc).
CONFIG_HEAP_MEM_POOL_SIZE=65536
