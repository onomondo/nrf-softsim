name: Onboard to MemBrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  load-targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  # Runs the `membrowse onboard` CLI directly instead of the onboard action:
  # the build needs the west workspace layout inside the NCS toolchain
  # container, and the CLI has to run from the repo checkout inside it.
  onboard:
    needs: load-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0@sha256:f1dca44678dae83e37404e33f369786f5b2ffe2ed497eec1815f66c3a868bace
    defaults:
      run:
        # Bash shell is needed to set toolchain related environment variables in docker container
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      - name: Initialize workspace
        run: |
          west init -m https://github.com/${GITHUB_REPOSITORY}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: modules/lib/onomondo-softsim
          # Onboard iterates through historical commits, so it needs full history
          fetch-depth: 0
          submodules: true

      - name: Fetch nRF and Zephyr workspaces and dependencies
        run: |
          west update -o=--depth=1 --narrow

      - name: Install MemBrowse
        run: pip install membrowse

      - name: Run MemBrowse onboard
        working-directory: modules/lib/onomondo-softsim
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          MEMBROWSE_API_URL: ${{ vars.MEMBROWSE_API_URL || 'https://api.membrowse.com' }}
        run: |
          git config --global --add safe.directory "$PWD"
          zephyr=samples/softsim_external_profile/build/softsim_external_profile/zephyr
          membrowse onboard "${{ inputs.num_commits }}" \
            "git submodule update --init && (cd samples/softsim_external_profile && west build --sysbuild --pristine=always --board ${{ matrix.board }})" \
            "$zephyr/${{ matrix.elf }}" \
            "${{ matrix.target_name }}" \
            "$MEMBROWSE_API_KEY" \
            "$MEMBROWSE_API_URL" \
            --ld-scripts "$zephyr/${{ matrix.ld }}" \
            --map-file "$zephyr/${{ matrix.map_file }}" \
            --build-dirs lib samples dts boards sysbuild zephyr
