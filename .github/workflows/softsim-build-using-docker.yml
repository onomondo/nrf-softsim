name: SoftSIM for nRF91 Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-in-docker-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0@sha256:f1dca44678dae83e37404e33f369786f5b2ffe2ed497eec1815f66c3a868bace
    defaults:
      run:
        # Bash shell is needed to set toolchain related environment variables in docker container
        # It is a workaround for GitHub Actions limitation https://github.com/actions/runner/issues/1964
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        board: [nrf9160dk/nrf9160/ns, nrf9161dk/nrf9161/ns, nrf9151dk/nrf9151/ns, thingy91/nrf9160/ns, thingy91x/nrf9151/ns]

    steps:
      # Initialize a Zephyr West workspace in its default format
      - name: Initialize workspace
        run: |
          west init -m https://github.com/${GITHUB_REPOSITORY}

      # Ensure that the checkout follows only this build sha and not the master branch
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: modules/lib/onomondo-softsim
          submodules: true

      # Update dependencies and submodules using west
      - name: Fetch nRF and Zephyr workspaces and dependencies
        run: |
          west update -o=--depth=1 --narrow

      - name: Build firmware of SoftSIM sample
        working-directory: modules/lib/onomondo-softsim/samples/softsim_external_profile
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }}
          test -f build/merged.hex

      - name: Archive name generator
        id: artifact_name
        run: echo "artifact_name=$(echo ${{ matrix.board }} | tr "/" "_")" >> $GITHUB_OUTPUT

      - name: Archive SoftSIM External Profile Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: modules/lib/onomondo-softsim/samples/softsim_external_profile/build/merged.hex
          overwrite: true
          if-no-files-found: warn

      # Compile-check the static-profile mode too. The static vs external delta is
      # board-independent, so one board is enough. Runs after the archive so its
      # pristine rebuild doesn't clobber the archived (external) merged.hex.
      - name: Build firmware (static profile mode, compile check)
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        working-directory: modules/lib/onomondo-softsim/samples/softsim_external_profile
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -- -DEXTRA_CONF_FILE=overlay-static.conf

      # The sysbuild hook runs for every sysbuild build in the workspace; hello_world
      # proves it works without the (deprecated, default-off) Partition Manager.
      - name: Build an unrelated sample without Partition Manager
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -d build-hello zephyr/samples/hello_world

      # Proves nrf_softsim_init() links. The grep keeps CONFIG_SOFTSIM_AUTO_INIT out
      # of overlay-softsim.conf, where it would override an application's opt-out.
      - name: Build firmware (manual init mode)
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        working-directory: modules/lib/onomondo-softsim/samples/softsim_external_profile
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -- -DEXTRA_CONF_FILE=overlay-manual-init.conf
          grep -qx '# CONFIG_SOFTSIM_AUTO_INIT is not set' \
            build/softsim_external_profile/zephyr/.config
          ! grep -q '^CONFIG_SOFTSIM_AUTO_INIT' ../../overlay-softsim.conf

      # Canary for the deprecated Partition Manager flow, which stays supported
      # during the devicetree transition window. One board is enough.
      - name: Build firmware (Partition Manager mode, canary)
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        working-directory: modules/lib/onomondo-softsim/samples/softsim_external_profile
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -- -DSB_CONFIG_PARTITION_MANAGER=y
          test -f build/merged.hex

      # Every step above builds our own sample, which wires SoftSIM in through
      # its CMakeLists.txt, sysbuild.conf and boards/<board>.overlay. These two
      # cover the README's integration path instead: SoftSIM added to somebody
      # else's application. at_client is a small NCS sample that uses the modem
      # library and builds without a bootloader, which is what
      # nrf91_softsim_partitions.dtsi is written for.
      #
      # DTC_OVERLAY_FILE, not EXTRA_DTC_OVERLAY_FILE: at_client carries its own
      # partition layout and the two cannot stack, so ours has to replace the
      # application's overlay list rather than append to it.
      - name: Build a foreign application with SoftSIM
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        env:
          SOFTSIM: modules/lib/onomondo-softsim
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -d build-at-client nrf/samples/cellular/at_client \
            -- -DOVERLAY_CONFIG="$PWD/$SOFTSIM/overlay-softsim.conf" \
               -DDTC_OVERLAY_FILE="$PWD/$SOFTSIM/dts/softsim/nrf91_softsim_partitions.dtsi;$PWD/$SOFTSIM/dts/softsim/nrf91_softsim_sram.dtsi"
          grep -qx 'CONFIG_SOFTSIM=y' build-at-client/at_client/zephyr/.config

      # Same, bundling the template: an integrator has to be able to produce a
      # flashable artifact for their own application, not just for our sample.
      - name: Build a foreign application with SoftSIM (bundled template)
        if: matrix.board == 'nrf9151dk/nrf9151/ns'
        env:
          SOFTSIM: modules/lib/onomondo-softsim
        run: |
          west build --sysbuild --pristine=always --board ${{ matrix.board }} \
            -d build-at-client-bundled nrf/samples/cellular/at_client \
            -- -DOVERLAY_CONFIG="$PWD/$SOFTSIM/overlay-softsim.conf" \
               -DDTC_OVERLAY_FILE="$PWD/$SOFTSIM/dts/softsim/nrf91_softsim_partitions.dtsi;$PWD/$SOFTSIM/dts/softsim/nrf91_softsim_sram.dtsi" \
               -DSB_CONFIG_SOFTSIM_BUNDLE_TEMPLATE_HEX=y
          test -f build-at-client-bundled/merged.hex
