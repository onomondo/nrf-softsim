# Build this app as an LLVM libfuzzer target (native_sim/native/64 + clang).
CONFIG_ARCH_POSIX_LIBFUZZER=y

# Keep Zephyr __ASSERT active. The core's own assert() comes from libc and is
# governed by NDEBUG (off in Twister debug builds), so its preconditions still
# fire -- the harness guards the ones it must not trip.
CONFIG_ASSERT=y

# No flash, NVS or heap pool: the stateless parsers use the host malloc (system
# heap) and touch no filesystem.
