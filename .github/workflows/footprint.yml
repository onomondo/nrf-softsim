name: Firmware Footprint

# Flash/RAM delta of a PR (its test merge commit vs that commit's first parent) for the app and TF-M
# images of the sample on nrf9151dk; see .github/scripts/footprint.py for the method.
on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - '**.conf'
      - '**.overlay'
      - '**.dtsi'
      - '**/Kconfig*'
      - '**/CMakeLists.txt'
      - 'west.yml'
      - 'zephyr/module.yml'
      - 'lib/onomondo-uicc'
      # Not in the sample image. Order matters: the last matching pattern wins, so this workflow re-includes itself.
      - '!tests/**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/footprint.yml'
      - '.github/scripts/footprint.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.ref }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.2@sha256:54d1b800cc92602b5206b21a447696982177ac89cdef8c8ca8ef5cab419e0046
    defaults:
      run:
        # Bash sets the toolchain environment in the container (actions/runner#1964).
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        ref: [base, pr]

    steps:
      # west.yml's self.path is not honored by `west init -l`, so init from the URL and check out over it.
      - name: Initialize workspace
        run: |
          west init -m "https://github.com/${GITHUB_REPOSITORY}"
          git config --global --add safe.directory '*'  # the workspace is bind-mounted from the host

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/lib/onomondo-softsim
          submodules: true
          fetch-depth: 2

      # Base and PR are the two sides of the test merge, so commits merged since the PR branched cancel out.
      - name: Select the base (the merge commit's first parent)
        if: matrix.ref == 'base'
        working-directory: modules/lib/onomondo-softsim
        run: |
          git checkout -q HEAD^1
          git submodule update --init

      - name: Fetch nRF and Zephyr workspaces and dependencies
        run: |
          west update -o=--depth=1 --narrow

      - name: Build firmware (nrf9151dk)
        working-directory: modules/lib/onomondo-softsim/samples/softsim_external_profile
        run: |
          west build --sysbuild --pristine=always --board nrf9151dk/nrf9151/ns
          out=$GITHUB_WORKSPACE/out
          mkdir -p "$out"
          cp build/softsim_external_profile/zephyr/zephyr.map "$out/app.map"
          cp build/softsim_external_profile/tfm/bin/tfm_s.map "$out/tfm.map"
          git rev-parse HEAD > "$out/sha"

      - name: Upload linker maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-${{ matrix.ref }}
          path: out/
          if-no-files-found: error

  report:
    name: footprint delta
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download linker maps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: footprint-*

      - name: Write report
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # shellcheck disable=SC2016  # backticks are Markdown
          {
            echo '### Firmware footprint delta — `nrf9151dk/nrf9151/ns`'
            echo
            echo 'softsim_external_profile. Region use is what the linker reports (`ld --print-memory-usage`); the breakdowns come from the linker map and add up to it.'
            echo
            python3 .github/scripts/footprint.py footprint-base footprint-pr
            echo "<sub>Soft report — informational only. Base \`$(cut -c1-7 footprint-base/sha)\` vs \`$(cut -c1-7 footprint-pr/sha)\`, the test merge of PR head \`${HEAD_SHA::7}\` into it.</sub>"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          [ "$SAME_REPO" = true ] || echo "::notice title=Footprint report::Fork PR: its token is read-only, so the report is in this run's job summary instead of a PR comment."

      - name: Post footprint comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: firmware-footprint
          path: report.md
