# Onomondo SoftSIM Configurations
# Don't set CONFIG_SOFTSIM_AUTO_INIT here; it would override an application's
# prj.conf opt-out of auto-init (CI-enforced).
CONFIG_SOFTSIM=y

# Log subsystem on; SoftSIM Kconfig sets sensible defaults
CONFIG_LOG=y
CONFIG_NRF_MODEM_LOG=n

# NVS Configurations
CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_ERR=y
CONFIG_PM_PARTITION_SIZE_NVS_STORAGE=0x8000

# Flash Configurations
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Auto-init runs SoftSIM fs init on the main stack (SYS_INIT); a hard
# assignment, so it overrides the application's value in both directions.
CONFIG_MAIN_STACK_SIZE=5000

# No CONFIG_HEAP_MEM_POOL_SIZE on purpose: SoftSIM allocates from its own
# CONFIG_SOFTSIM_HEAP_SIZE. Declare your own if your application uses k_malloc.

# TF-M Configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_PM_PARTITION_SIZE_TFM=0x18000
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0xC000
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# PSA Crypto Configurations
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# Libraries
CONFIG_NEWLIB_LIBC=y
