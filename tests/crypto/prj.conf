CONFIG_ZTEST=y
CONFIG_ASSERT=y

# ss_heap.c routes SS_ALLOC through k_malloc.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# PSA crypto, provided off-target by Mbed TLS rather than TF-M. The algorithm
# set is what ss_crypto.c asks for: AES-CBC without padding for the cipher
# helpers, CMAC for the OTA cryptographic checksum.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096

# psa_import_key() is called with PSA_KEY_LIFETIME_PERSISTENT, so the key store
# has to exist. The custom backend in src/ram_its_store.c keeps it in RAM: the
# alternatives are settings/NVS or ZMS, which would drag in the flash simulator
# and with it the UBSan exclusion the storage suites need.
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_CUSTOM=y

# Key derivation inside the PSA core wants entropy; native_sim has no hardware
# source, so use the same non-cryptographic stand-in Zephyr's own PSA tests use.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=y
