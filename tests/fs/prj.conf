CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NVS=y

# ss_fs.c caches file contents on the kernel heap via ss_heap.c.
CONFIG_HEAP_MEM_POOL_SIZE=32768

# A storage cache is exactly the kind of code that leaks state between tests.
# Repeat counts pinned to 1: their default of 3 each would re-run every case nine
# times, and suite_setup is not idempotent (it re-seeds NVS while ss_init_fs()
# early-returns on fs_is_initialized, leaving the cache describing old flash).
CONFIG_ZTEST_SHUFFLE=y
CONFIG_ZTEST_SHUFFLE_SUITE_REPEAT_COUNT=1
CONFIG_ZTEST_SHUFFLE_TEST_REPEAT_COUNT=1
