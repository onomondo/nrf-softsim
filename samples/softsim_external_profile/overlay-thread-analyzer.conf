# Logs every thread's stack high-water mark, by name, every 30 s.
# Build: west build --sysbuild -b <board> -- -DEXTRA_CONF_FILE=overlay-thread-analyzer.conf
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
# Timestamped log lines rather than printk; LOG_DEFAULT_LEVEL is ERR under SOFTSIM.
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_LOG_LEVEL_INF=y
# Headroom for a ~20-message pass sharing the buffer with AT responses.
# A SOFTSIM_*_DEBUG_LOGS build needs its larger default instead: drop this line.
CONFIG_LOG_BUFFER_SIZE=4096
