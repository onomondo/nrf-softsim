name: Check Markdown Links

on:
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # Accept 403 (Forbidden) and 429 (rate limit) to avoid false positives.
          # CHANGELOG.md is generated by release-please from commit subjects, so a
          # link it gets wrong cannot be fixed in place -- and it is three quarters
          # of the requests, all to github.com, which sometimes answers 404 under
          # its anti-abuse layer and reds an unrelated pull request.
          args: --accept "200,403,429" --verbose --no-progress --exclude-path CHANGELOG.md './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
